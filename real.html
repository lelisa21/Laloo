<title>Lelisa Hailu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: hard-edged index sheet. Ruled full-width sections, one oversized variable-width name that reacts to the pointer, and motion carrying every other section. */
:root{
  --bg:#ecefe9; --bg2:#e0e6dd; --ink:#0a1f18; --mute:#4a6055;
  --line:#0a1f18; --soft:#b9c6bd; --acc:#0a7a52; --acc-ink:#ecefe9;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06130e; --bg2:#0d211a; --ink:#e7f0ea; --mute:#8ea99b;
    --line:#4f7d68; --soft:#1c3a2d; --acc:#3ee0a1; --acc-ink:#04140d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06130e; --bg2:#0d211a; --ink:#e7f0ea; --mute:#8ea99b;
  --line:#4f7d68; --soft:#1c3a2d; --acc:#3ee0a1; --acc-ink:#04140d; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.6;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased; overflow-x:clip;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:70; background:var(--bg)}
::selection{background:var(--acc); color:var(--acc-ink)}
:focus-visible{outline:3px solid var(--acc); outline-offset:3px}
a{color:inherit}
button{font:inherit}
.wrap{max-width:1360px; margin-inline:auto; padding-inline:clamp(0px,2.5vw,32px)}
.mono{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase}

.progress{position:fixed; top:env(safe-area-inset-top, 0px); left:0; right:0; height:4px; background:var(--acc); transform-origin:0 50%; z-index:80}

/* nav */
.nav{position:sticky; top:env(safe-area-inset-top, 0px); z-index:50; background:var(--bg); border-bottom:2px solid var(--line)}
.nav-in{display:flex; align-items:center; gap:8px 16px; min-height:56px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; background:none; border:0; color:inherit; cursor:pointer; padding:0}
.mark{width:36px; height:36px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-family:var(--f-display); font-weight:900; font-size:15px; letter-spacing:-.04em; transition:background .3s, color .3s}
.brand:hover .mark{background:var(--acc); color:var(--acc-ink)}
.brand-name{font-family:var(--f-display); font-weight:800; font-size:15px; letter-spacing:-.01em}
.nav-links{display:flex; margin-left:auto; overflow-x:auto; scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nl{position:relative; padding:10px 12px; font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:none; border:0; color:var(--mute); cursor:pointer; white-space:nowrap}
.nl:hover,.nl.on{color:var(--ink)}
.nl-ind{position:absolute; left:12px; right:12px; bottom:3px; height:3px; background:var(--acc)}
.clock{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap}
.clock b{color:var(--ink); font-weight:500}
.tog{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border:2px solid var(--line); background:transparent; color:var(--ink); font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer}
.tog:hover{background:var(--ink); color:var(--bg)}
.tog i{display:block; width:10px; height:10px; background:var(--acc)}
@media (max-width:860px){
  .clock{display:none}
  .tog{margin-left:auto}
  .nav-links{order:3; width:100%; margin-left:0}
}

/* buttons */
.btn{position:relative; display:inline-flex; align-items:center; gap:10px; padding:14px 20px; border:2px solid var(--line); background:transparent; color:var(--ink); font-family:var(--f-mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; overflow:hidden; isolation:isolate; text-decoration:none}
.btn::before{content:""; position:absolute; inset:0; background:var(--acc); transform:translateY(101%); transition:transform .45s cubic-bezier(.22,1,.36,1); z-index:-1}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn:hover{color:var(--acc-ink); border-color:var(--acc)}
.btn.solid{background:var(--ink); color:var(--bg)}
.btn.solid:hover{color:var(--acc-ink)}
.btn svg{width:14px; height:14px; flex:none}

/* hero */
.hero{position:relative; isolation:isolate; padding-top:clamp(16px,3vw,32px); padding-bottom:clamp(48px,7vw,96px)}
.gridbg{position:absolute; inset:0 0 -140px 0; z-index:-1; pointer-events:none; opacity:.55;
  background-image:linear-gradient(var(--soft) 1px, transparent 1px), linear-gradient(90deg, var(--soft) 1px, transparent 1px);
  background-size:64px 64px; -webkit-mask-image:linear-gradient(to bottom,#000,transparent 80%); mask-image:linear-gradient(to bottom,#000,transparent 80%)}
.eyebrow{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 24px; padding-block:14px; border-bottom:1px solid var(--soft); color:var(--mute)}
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) clamp(240px,26vw,360px); gap:clamp(24px,4vw,56px); align-items:end; margin-top:clamp(20px,3vw,40px)}
.name-col{container-type:inline-size; min-width:0}
.name{margin:0; font-family:var(--f-display); font-size:clamp(3rem,24cqw,16rem); line-height:.88; text-transform:uppercase; letter-spacing:-.03em; font-weight:800; font-variation-settings:"wdth" 78,"wght" 700}
.name-line{display:flex; white-space:nowrap}
.mask{display:block; overflow:hidden; padding-top:.05em}
.glyph{display:block; will-change:transform}
.hero-copy{max-width:54ch; margin:clamp(20px,3vw,36px) 0 0; font-size:clamp(18px,1.6vw,21px); line-height:1.5}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:28px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:28px 0 0; padding:0; list-style:none}
.chip{border:1px solid var(--line); padding:6px 10px; font-family:var(--f-mono); font-size:12px; letter-spacing:.03em}
.chip b{color:var(--acc); font-weight:500}
.portrait{margin:0; position:relative; aspect-ratio:4/5; max-width:100%; border:2px solid var(--line); background:var(--bg2); overflow:hidden; cursor:crosshair}
.portrait img{width:100%; height:100%; object-fit:cover; object-position:50% 18%; display:block; filter:grayscale(1) contrast(1.08); transition:filter .6s}
.portrait .tint{position:absolute; inset:0; background:var(--acc); mix-blend-mode:multiply; opacity:.5; transition:opacity .6s; pointer-events:none}
.portrait.hov img{filter:none}
.portrait.hov .tint{opacity:0}
.portrait figcaption{position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; gap:8px; padding:8px 10px; background:var(--bg); border-top:2px solid var(--line); font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.scrollhint{display:flex; align-items:center; gap:12px; margin-top:40px; color:var(--mute)}
.scrollhint i{display:block; width:48px; height:2px; background:var(--soft); position:relative; overflow:hidden}
.scrollhint i::after{content:""; position:absolute; inset:0; background:var(--acc); animation:slide 1.8s cubic-bezier(.65,0,.35,1) infinite}
@keyframes slide{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@media (max-width:900px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .portrait{max-width:320px}
}

/* marquee */
.mq{overflow:hidden; border-block:2px solid var(--line); padding-block:clamp(10px,2vw,22px); background:var(--bg)}
.mq + .mq{border-top:0}
.track{display:flex; width:max-content; will-change:transform}
.copy{display:flex; flex:none}
.mq-item{display:inline-flex; align-items:center; font-family:var(--f-display); font-variation-settings:"wdth" 100,"wght" 850; font-size:clamp(2.2rem,6vw,5rem); line-height:1; text-transform:uppercase; letter-spacing:-.02em; padding-right:.5em; white-space:nowrap}
.mq-item.out{color:transparent; -webkit-text-stroke:2px var(--ink)}
.mq-dot{display:inline-block; width:.2em; height:.2em; background:var(--acc); margin-left:.5em}

/* sections */
.sec{padding-block:clamp(72px,10vw,140px); scroll-margin-top:84px}
.sh{margin-bottom:clamp(32px,5vw,64px)}
.kicker{font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--acc); margin-bottom:14px}
.sh-row{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 40px; margin-bottom:22px}
.sh-title{margin:0; font-family:var(--f-display); font-variation-settings:"wdth" 92,"wght" 850; font-size:clamp(2.6rem,8vw,7rem); line-height:.95; text-transform:uppercase; letter-spacing:-.035em; text-wrap:balance; min-width:0}
.sh-note{max-width:38ch; margin:0; color:var(--mute)}
.rule{height:2px; background:var(--line); transform-origin:left}

/* about */
.about-text{margin:0; font-family:var(--f-display); font-weight:600; font-size:clamp(1.5rem,3.6vw,3.1rem); line-height:1.18; letter-spacing:-.02em; max-width:26em}
.w{position:relative; display:inline-block; margin-right:.26em}
.w-base{color:var(--mute)}
.w-top{position:absolute; left:0; top:0; color:var(--ink); white-space:nowrap}
.info{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:2px solid var(--line); margin-top:clamp(40px,6vw,72px)}
.info > div{padding:clamp(18px,2.4vw,28px); min-width:0}
.info > div + div{border-left:2px solid var(--line)}
.info h3{margin:0 0 14px; font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--acc); font-weight:500}
.info p{margin:0 0 12px}
.info small{display:block; color:var(--mute); font-size:14px}
.info strong{font-weight:700}
.lang{display:flex; justify-content:space-between; gap:12px; padding-block:8px; border-bottom:1px solid var(--soft)}
.lang span:last-child{font-family:var(--f-mono); font-size:12px; color:var(--mute); letter-spacing:.06em; text-transform:uppercase}
@media (max-width:860px){
  .info{grid-template-columns:minmax(0,1fr)}
  .info > div + div{border-left:0; border-top:2px solid var(--line)}
}

/* work */
.projs{border-top:2px solid var(--line)}
.proj{border-bottom:2px solid var(--line)}
.proj-head{position:relative; width:100%; display:grid; grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto 44px; grid-template-areas:"role name kind plus"; align-items:center; gap:16px; padding:clamp(18px,3vw,32px) 8px; background:none; border:0; color:var(--ink); text-align:left; cursor:pointer; overflow:hidden; isolation:isolate}
.proj-head::before{content:""; position:absolute; inset:0; background:var(--acc); transform:scaleY(0); transform-origin:bottom; transition:transform .5s cubic-bezier(.22,1,.36,1); z-index:-1}
.proj-head:hover::before,.proj-head:focus-visible::before{transform:scaleY(1)}
.proj-head:hover,.proj-head:focus-visible{color:var(--acc-ink)}
.proj-role{grid-area:role; font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
.proj-name{grid-area:name; font-family:var(--f-display); font-variation-settings:"wdth" 100,"wght" 800; font-size:clamp(2.4rem,6.5vw,5rem); line-height:1; letter-spacing:-.03em; min-width:0; overflow-wrap:anywhere}
.proj-kind{grid-area:kind; font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); text-align:right}
.proj-plus{grid-area:plus; font-family:var(--f-display); font-size:2.4rem; font-weight:300; line-height:1; justify-self:center}
.proj-head:hover .proj-role,.proj-head:hover .proj-kind,.proj-head:focus-visible .proj-role,.proj-head:focus-visible .proj-kind{color:var(--acc-ink)}
.proj-body{overflow:hidden}
.proj-inner{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:clamp(20px,4vw,56px); padding:8px 8px clamp(28px,4vw,48px)}
.pts{list-style:none; margin:0 0 22px; padding:0; display:grid; gap:14px; max-width:60ch}
.pts li{display:grid; grid-template-columns:8px minmax(0,1fr); gap:14px}
.pts li::before{content:""; width:8px; height:8px; background:var(--acc); margin-top:.62em}
.tags{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 26px; padding:0; list-style:none}
.viz{border:2px solid var(--line); background:var(--bg2); min-height:290px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.viz-cap{display:flex; justify-content:space-between; gap:8px; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.bid-now{font-family:var(--f-display); font-variation-settings:"wdth" 100,"wght" 850; font-size:clamp(1.9rem,4vw,2.9rem); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.timer{height:6px; background:var(--soft)}
.timer i{display:block; height:100%; background:var(--acc); transition:width 1s linear}
.bids{list-style:none; margin:0; padding:0; display:grid; align-content:start}
.bids li{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--soft); font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums}
.bids li:first-child{color:var(--acc); font-weight:500}
.net{width:100%; height:auto; display:block; flex:1; min-height:0}
.net .e{stroke:var(--soft); stroke-width:1.5}
.net .n{fill:var(--mute)}
.net .hot{fill:var(--acc)}
.net .link{stroke:var(--acc); stroke-width:3; fill:none}
.net .ring{fill:none; stroke:var(--acc); stroke-width:2}
.net text{fill:var(--ink); font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.stairs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; align-items:end; margin-top:auto}
.stair{display:flex; flex-direction:column; gap:8px; min-width:0}
.stair-area{height:180px; display:flex; align-items:flex-end}
.bar{width:100%; background:var(--bg); border:2px solid var(--line); transition:background .4s}
.bar.on{background:var(--acc)}
.stair-l{font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; overflow-wrap:anywhere}
@media (max-width:860px){
  .proj-head{grid-template-columns:minmax(0,1fr) 44px; grid-template-areas:"role plus" "name name" "kind kind"; gap:8px 16px}
  .proj-kind{text-align:left}
  .proj-inner{grid-template-columns:minmax(0,1fr)}
}

/* experience */
.tl{--tlpad:clamp(28px,4vw,44px); position:relative; display:grid; gap:clamp(28px,5vw,56px); padding-left:var(--tlpad)}
.spine{position:absolute; left:7px; top:8px; bottom:8px; width:2px; background:var(--soft)}
.spine-fill{position:absolute; inset:0; background:var(--acc); transform-origin:top}
.ex{position:relative; display:grid; grid-template-columns:minmax(140px,230px) minmax(0,1fr); gap:clamp(16px,3vw,40px)}
.dot{position:absolute; left:calc(var(--tlpad) * -1); top:.3em; width:16px; height:16px; border:2px solid var(--line); background:var(--bg)}
.ex-meta{display:flex; flex-direction:column; gap:6px; font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
.ex-meta b{color:var(--ink); font-weight:500}
.ex-card{border:2px solid var(--line); background:var(--bg); padding:clamp(18px,2.4vw,28px); transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s cubic-bezier(.22,1,.36,1)}
.ex-card:hover{transform:translate(-6px,-6px); box-shadow:6px 6px 0 var(--acc)}
.ex-org{margin:0 0 6px; font-family:var(--f-display); font-variation-settings:"wdth" 96,"wght" 850; font-size:clamp(1.7rem,3.2vw,2.5rem); line-height:1; text-transform:uppercase; letter-spacing:-.02em}
.ex-role{margin:0 0 16px; color:var(--acc); font-weight:600}
@media (max-width:760px){ .ex{grid-template-columns:minmax(0,1fr)} }

/* stack */
.stack{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:2px solid var(--line); border-left:2px solid var(--line)}
.cell{position:relative; min-height:190px; padding:22px 20px 26px; border-right:2px solid var(--line); border-bottom:2px solid var(--line); overflow:hidden; isolation:isolate; min-width:0}
.cell::before{content:""; position:absolute; inset:0; background:var(--acc); transform:translateY(101%); transition:transform .5s cubic-bezier(.22,1,.36,1); z-index:-1}
.cell:hover::before{transform:none}
.cell:hover{color:var(--acc-ink)}
.cell h3{margin:0 0 18px; font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:500; color:var(--mute); transition:color .3s}
.cell:hover h3{color:var(--acc-ink)}
.cell ul{list-style:none; margin:0; padding:0; display:grid; gap:6px; font-family:var(--f-display); font-variation-settings:"wdth" 100,"wght" 700; font-size:1.35rem; line-height:1.15}
.cell li{transition:transform .45s cubic-bezier(.22,1,.36,1)}
.cell:hover li{transform:translateX(8px)}
.cell:hover li:nth-child(2){transition-delay:.04s}
.cell:hover li:nth-child(3){transition-delay:.08s}
.cell:hover li:nth-child(4){transition-delay:.12s}
@media (max-width:1000px){ .stack{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .stack{grid-template-columns:minmax(0,1fr)} .cell{min-height:0} }

/* awards */
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:2px solid var(--line)}
.stat{display:flex; flex-direction:column; gap:14px; padding:clamp(20px,3vw,36px); min-width:0}
.stat + .stat{border-left:2px solid var(--line)}
.stat-v{font-family:var(--f-display); font-variation-settings:"wdth" 100,"wght" 900; font-size:clamp(3.4rem,8vw,7rem); line-height:.9; letter-spacing:-.04em; font-variant-numeric:tabular-nums; color:var(--acc)}
.stat-t{margin:0; font-weight:700; font-size:18px}
.stat-d{margin:0; color:var(--mute); font-size:15px}
.certs{margin-top:clamp(40px,6vw,72px); border-top:2px solid var(--line)}
.certs h3{margin:18px 0 8px}
.cert{display:grid; grid-template-columns:minmax(120px,280px) minmax(0,1fr); gap:6px 16px; padding:16px 8px; border-bottom:1px solid var(--soft); transition:transform .4s cubic-bezier(.22,1,.36,1), color .3s}
.cert:hover{transform:translateX(10px); color:var(--acc)}
.cert span:first-child{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.cert:hover span:first-child{color:inherit}
.cert span:last-child{font-weight:600}
@media (max-width:760px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat + .stat{border-left:0; border-top:2px solid var(--line)}
  .cert{grid-template-columns:minmax(0,1fr)}
}

/* contact */
.cta{margin:0 0 clamp(32px,5vw,64px); font-family:var(--f-display); font-variation-settings:"wdth" 92,"wght" 850; font-size:clamp(2.8rem,10vw,9rem); line-height:.92; text-transform:uppercase; letter-spacing:-.04em; text-wrap:balance}
.cta .wd{display:inline-block; margin-right:.2em}
.cta .hl{color:var(--acc)}
.contact-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:2px solid var(--line)}
.c{display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding:clamp(18px,2.4vw,28px); min-width:0}
.c + .c{border-left:2px solid var(--line)}
.c-val{font-family:var(--f-display); font-variation-settings:"wdth" 100,"wght" 700; font-size:clamp(1.1rem,2vw,1.5rem); overflow-wrap:anywhere; user-select:all}
.c-links{list-style:none; margin:0; padding:0; display:grid; gap:2px; width:100%}
.c-links a{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--soft); text-decoration:none; font-weight:600; transition:color .3s, padding .3s}
.c-links a:hover{color:var(--acc); padding-left:8px}
.c-links small{font-family:var(--f-mono); font-size:12px; color:var(--mute); font-weight:400; overflow-wrap:anywhere; text-align:right}
.foot{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; padding-block:28px 40px; margin-top:clamp(56px,8vw,96px); border-top:2px solid var(--line); color:var(--mute)}
@media (max-width:860px){
  .contact-grid{grid-template-columns:minmax(0,1fr)}
  .c + .c{border-left:0; border-top:2px solid var(--line)}
}

/* cursor + toast */
.cur{position:fixed; left:0; top:0; z-index:100; pointer-events:none}
.cur-box{position:absolute; display:grid; place-items:center; border:2px solid var(--acc); transform:translate(-50%,-50%); font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc-ink); overflow:hidden; white-space:nowrap}

.toast-wrap{position:fixed; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; justify-content:center; pointer-events:none; z-index:90}
.toast{background:var(--ink); color:var(--bg); padding:12px 18px; font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; border:2px solid var(--acc)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important}
}

<script>
const { useState, useEffect, useRef, useCallback, useContext, createContext } = React;
const { motion, AnimatePresence, useScroll, useSpring, useTransform, useMotionValue, useMotionTemplate,
  useVelocity, useAnimationFrame, useInView, animate, useReducedMotion } = Motion;
const html = htm.bind(React.createElement);
const EASE = [0.22, 1, 0.36, 1];
const wrap = (min, max, v) => { const r = max - min; return ((((v - min) % r) + r) % r) + min; };

];

const ToastCtx = createContext(() => {});

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}

function useFinePointer() {
  const [v, setV] = useState(false);
  useEffect(() => { try { setV(window.matchMedia("(hover: hover) and (pointer: fine)").matches); } catch (e) {} }, []);
  return v;
}

function Arrow() {
  return html`<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 11 11 3M5 3h6v6" fill="none" stroke="currentColor" strokeWidth="2"/></svg>`;
}

function Reveal({ children, delay = 0, y = 28, as = "div", className = "", style }) {
  const reduce = useReducedMotion();
  const Tag = motion[as];
  return html`<${Tag} className=${className} style=${style}
    initial=${reduce ? { opacity: 1, y: 0 } : { opacity: 0.25, y }}
    whileInView=${{ opacity: 1, y: 0 }}
    viewport=${{ once: true, amount: 0.2 }}
    transition=${{ duration: 0.8, ease: EASE, delay }}>${children}<//>`;
}

function Rule() {
  return html`<${motion.div} className="rule" initial=${{ scaleX: 0.15 }} whileInView=${{ scaleX: 1 }}
    viewport=${{ once: true, amount: 1 }} transition=${{ duration: 1.1, ease: EASE }} />`;
}

function SectionHead({ kicker, title, note }) {
  return html`<header className="sh">
    <${Reveal} className="kicker">${kicker}<//>
    <div className="sh-row">
      <${Reveal} as="h2" className="sh-title" y=${40}>${title}<//>
      ${note && html`<${Reveal} as="p" className="sh-note" delay=${0.1}>${note}<//>`}
    </div>
    <${Rule} />
  </header>`;
}

function Magnetic({ children, strength = 0.3 }) {
  const ref = useRef(null);
  const x = useMotionValue(0), y = useMotionValue(0);
  const sx = useSpring(x, { stiffness: 200, damping: 15, mass: 0.4 });
  const sy = useSpring(y, { stiffness: 200, damping: 15, mass: 0.4 });
  const onMove = (e) => {
    if (e.pointerType === "touch" || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    x.set((e.clientX - (r.left + r.width / 2)) * strength);
    y.set((e.clientY - (r.top + r.height / 2)) * strength);
  };
  const reset = () => { x.set(0); y.set(0); };
  return html`<${motion.div} ref=${ref} style=${{ x: sx, y: sy, display: "inline-block" }}
    onPointerMove=${onMove} onPointerLeave=${reset}>${children}<//>`;
}

function CopyBtn({ value, label }) {
  const toast = useContext(ToastCtx);
  const [done, setDone] = useState(false);
  const click = async () => {
    const ok = await copyText(value);
    toast(ok ? label + " copied" : "Select the text to copy it");
    if (ok) { setDone(true); setTimeout(() => setDone(false), 1600); }
  };
  return html`<${Magnetic}><button className="btn" onClick=${click}>${done ? "Copied" : "Copy " + label.toLowerCase()}</button><//>`;
}

function ScrollBar() {
  const { scrollYProgress } = useScroll();
  const sx = useSpring(scrollYProgress, { stiffness: 120, damping: 24, restDelta: 0.001 });
  return html`<${motion.div} className="progress" style=${{ scaleX: sx }} aria-hidden="true" />`;
}

function Cursor() {
  const fine = useFinePointer();
  const reduce = useReducedMotion();
  const mx = useMotionValue(-100), my = useMotionValue(-100);
  const x = useSpring(mx, { stiffness: 600, damping: 45, mass: 0.35 });
  const y = useSpring(my, { stiffness: 600, damping: 45, mass: 0.35 });
  const [lab, setLab] = useState(null);
  useEffect(() => {
    if (!fine || reduce) return;
    const mv = (e) => { mx.set(e.clientX); my.set(e.clientY); };
    const ov = (e) => {
      const t = e.target && e.target.closest ? e.target.closest("[data-cursor],a,button") : null;
      setLab(t ? (t.getAttribute("data-cursor") || "") : null);
    };
    window.addEventListener("pointermove", mv, { passive: true });
    document.addEventListener("pointerover", ov);
    return () => { window.removeEventListener("pointermove", mv); document.removeEventListener("pointerover", ov); };
  }, [fine, reduce]);
  if (!fine || reduce) return null;
  const big = lab !== null;
  return html`<${motion.div} className="cur" style=${{ x, y }} aria-hidden="true">
    <${motion.div} className=${"cur-box" + (big ? " big" : "")}
      animate=${{ width: big ? (lab ? 76 : 44) : 12, height: big ? (lab ? 76 : 44) : 12 }}
      transition=${{ duration: 0.3, ease: EASE }}>${lab}<//>
  <//>`;
}

function Toast({ msg }) {
  return html`<div className="toast-wrap" aria-live="polite"><${AnimatePresence}>
    ${msg && html`<${motion.div} key=${msg} className="toast" initial=${{ y: 24, opacity: 0 }} animate=${{ y: 0, opacity: 1 }}
      exit=${{ y: 12, opacity: 0 }} transition=${{ duration: 0.35, ease: EASE }}>${msg}<//>`}
  <//></div>`;
}

function Nav({ dark, onTheme, active, go }) {
  const [time, setTime] = useState("");
  useEffect(() => {
    const f = () => {
      try {
        setTime(new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit",
          timeZone: "Africa/Addis_Ababa", hour12: false }).format(new Date()));
      } catch (e) {}
    };
    f(); const id = setInterval(f, 1000); return () => clearInterval(id);
  }, []);
  return html`<nav className="nav" aria-label="Primary"><div className="nav-in">
    <button className="brand" onClick=${() => go("top")} aria-label="Back to top">
      <span className="mark">LH</span><span className="brand-name">Lelisa Hailu</span>
    </button>
    <div className="nav-links">
      ${NAV.map(([id, label]) => html`<button key=${id} className=${"nl" + (active === id ? " on" : "")} onClick=${() => go(id)}>
        ${label}
        ${active === id && html`<${motion.span} layoutId="nav-ind" className="nl-ind" transition=${{ duration: 0.4, ease: EASE }} />`}
      </button>`)}
    </div>
    <span className="clock" aria-label="Local time in Addis Ababa">Addis Ababa <b>${time}</b> EAT</span>
    <button className="tog" onClick=${onTheme} aria-pressed=${dark}><i></i>${dark ? "Dark" : "Light"}</button>
  </div></nav>`;
}

function Letter({ ch, i, mx, my, reduce }) {
  const ref = useRef(null);
  const c = useRef({ x: -9999, y: -9999, r: 300 });
  useEffect(() => {
    const m = () => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      c.current = { x: r.left + r.width / 2 + window.scrollX, y: r.top + r.height / 2 + window.scrollY, r: Math.max(r.height * 1.5, 220) };
    };
    m();
    window.addEventListener("resize", m);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(m);
    const t = setTimeout(m, 1600);
    return () => { window.removeEventListener("resize", m); clearTimeout(t); };
  }, []);
  const raw = useTransform([mx, my], ([x, y]) => {
    const dx = x - c.current.x, dy = (y - c.current.y) * 1.15;
    const t = Math.max(0, 1 - Math.hypot(dx, dy) / c.current.r);
    return 78 + 47 * t * t;
  });
  const w = useSpring(raw, { stiffness: 220, damping: 24, mass: 0.6 });
  const wg = useTransform(w, [78, 125], [700, 900]);
  const fvs = useMotionTemplate`"wdth" ${w}, "wght" ${wg}`;
  return html`<span ref=${ref} className="mask"><${motion.span} className="glyph" aria-hidden="true"
    initial=${reduce ? false : { y: "105%" }} animate=${{ y: 0 }}
    transition=${{ duration: 0.9, ease: EASE, delay: 0.15 + i * 0.055 }}
    style=${{ fontVariationSettings: fvs }}>${ch}<//></span>`;
}

function Name() {
  const reduce = useReducedMotion();
  const mx = useMotionValue(-9999), my = useMotionValue(-9999);
  const box = useRef(null);
  useEffect(() => {
    if (reduce || !box.current) return;
    const r = box.current.getBoundingClientRect();
    const x0 = r.left + window.scrollX, x1 = x0 + r.width * 0.78;
    my.set(r.top + window.scrollY + r.height * 0.5);
    let ctl = animate(mx, [x0, x1, x0], { duration: 7, ease: "easeInOut", repeat: Infinity, delay: 1.4 });
    const onMove = (e) => {
      if (e.pointerType === "touch") return;
      if (ctl) { ctl.stop(); ctl = null; }
      mx.set(e.pageX); my.set(e.pageY);
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => { window.removeEventListener("pointermove", onMove); if (ctl) ctl.stop(); };
  }, [reduce]);
  const lines = ["LELISA", "HAILU"];
  return html`<h1 className="name" ref=${box} aria-label="Lelisa Hailu">
    ${lines.map((ln, li) => html`<span className="name-line" key=${ln}>
      ${[...ln].map((ch, i) => html`<${Letter} key=${i} ch=${ch} i=${i + li * 6} mx=${mx} my=${my} reduce=${reduce} />`)}
    </span>`)}
  </h1>`;
}

function Marquee({ items, speed = 70, outline = false, reverse = false }) {
  const x = useMotionValue(0);
  const reduce = useReducedMotion();
  const { scrollY } = useScroll();
  const vel = useVelocity(scrollY);
  const sv = useSpring(vel, { damping: 50, stiffness: 400 });
  const vf = useTransform(sv, [0, 1000], [0, 5], { clamp: false });
  const dir = useRef(reverse ? 1 : -1);
  const one = useRef(null);
  const W = useRef(0);
  useEffect(() => {
    const m = () => { W.current = one.current ? one.current.offsetWidth : 0; };
    m(); window.addEventListener("resize", m);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(m);
    return () => window.removeEventListener("resize", m);
  }, []);
  useAnimationFrame((t, d) => {
    if (reduce || !W.current) return;
    const v = vf.get();
    const base = reverse ? 1 : -1;
    dir.current = v < -0.05 ? -base : base;
    const move = dir.current * speed * (d / 1000) * (1 + Math.abs(v) * 1.2);
    x.set(wrap(-W.current, 0, x.get() + move));
  });
  const row = (k) => html`<div className="copy" key=${k} ref=${k === 0 ? one : null}>
    ${items.map((t) => html`<span className=${"mq-item" + (outline ? " out" : "")} key=${t}>${t}<i className="mq-dot"></i></span>`)}
  </div>`;
  return html`<div className="mq" aria-hidden="true"><${motion.div} className="track" style=${{ x }}>${[0, 1, 2, 3].map(row)}<//></div>`;
}

function BidTicker() {
  const reduce = useReducedMotion();
  const names = ["A41", "K07", "M92", "T18", "R55"];
  const [bids, setBids] = useState([{ id: 3, who: "M92", amt: 48500 }, { id: 2, who: "K07", amt: 47000 }, { id: 1, who: "A41", amt: 45500 }]);
  const [left, setLeft] = useState(252);
  const amt = useMotionValue(48500);
  const shown = useTransform(amt, (v) => "ETB " + Math.round(v).toLocaleString("en-US"));
  useEffect(() => {
    if (reduce) return;
    let n = 4, last = 48500;
    const id = setInterval(() => {
      last += n % 2 ? 1000 : 500;
      const who = names[n % names.length], cur = n;
      setBids((b) => [{ id: cur, who, amt: last }, ...b].slice(0, 4));
      animate(amt, last, { duration: 0.7, ease: EASE });
      n++;
    }, 1900);
    const t = setInterval(() => setLeft((s) => (s > 15 ? s - 1 : 252)), 1000);
    return () => { clearInterval(id); clearInterval(t); };
  }, [reduce]);
  const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
  return html`<div className="viz">
    <div className="viz-cap"><span>Live bid · simulated</span><span>${mm}:${ss} left</span></div>

      ${bids.map((b) => html`<${motion.li} key=${b.id} layout initial=${{ opacity: 0, y: -18 }} animate=${{ opacity: 1, y: 0 }}
        exit=${{ opacity: 0, transition: { duration: 0.2 } }} transition=${{ duration: 0.5, ease: EASE }}>

    <//></ul>
  </div>`;
}

function App() {
  const reduce = useReducedMotion();
  const [active, setActive] = useState("");
  const [msg, setMsg] = useState(null);
  const timer = useRef(null);
  const [dark, setDark] = useState(() => {
    try {
      const t = document.documentElement.getAttribute("data-theme");
      if (t) return t === "dark";
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) { return false; }
  });
  const toast = useCallback((m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(null), 1800); }, []);
  const go = useCallback((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (id === "top") window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    else el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }, [reduce]);
  const onTheme = () => { const n = !dark; setDark(n); document.documentElement.setAttribute("data-theme", n ? "dark" : "light"); };
  useEffect(() => {
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); }), { rootMargin: "-45% 0px -50% 0px" });
    NAV.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);
  return html`<${ToastCtx.Provider} value=${toast}>
    <${ScrollBar} /><${Cursor} />
    <div className="wrap">
      <${Nav} dark=${dark} onTheme=${onTheme} active=${active} go=${go} />
      <main>
        <${Hero} go=${go} />
        <${Marquee} items=${MQ1} outline=${true} />
        <${Marquee} items=${MQ2} reverse=${true} speed=${60} />
        <${About} /><${Work} /><${Experience} /><${Stack} /><${Awards} /><${Contact} go=${go} />
      </main>
    </div>
    <${Toast} msg=${msg} />
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
