<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }
      body {
        font-family: "Instrument Sans", "Segoe UI", sans-serif;
        color: #f2f2f2;
      }
      .og {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        padding: 58px 70px 48px;
        overflow: hidden;
        background:
          radial-gradient(52% 42% at 88% 92%, rgba(255, 214, 10, 0.15), transparent 72%),
          radial-gradient(38% 34% at 0% 0%, rgba(255, 214, 10, 0.07), transparent 70%),
          #050505;
      }
      .og::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 46px 46px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 46px 46px;
        mask-image: radial-gradient(70% 80% at 45% 50%, #000, transparent);
      }
      .og::after {
        content: "";
        position: absolute;
        right: -170px;
        top: -180px;
        width: 520px;
        height: 520px;
        border: 1px solid rgba(255, 214, 10, 0.16);
        border-radius: 50%;
        box-shadow: 0 0 0 52px rgba(255, 214, 10, 0.028), 0 0 0 104px rgba(255, 214, 10, 0.014);
      }
      .top,
      .main,
      .footer {
        position: relative;
        z-index: 1;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      .brand i {
        color: #ffd60a;
        font-style: normal;
      }
      .place {
        border: 1px solid #272727;
        border-radius: 99px;
        padding: 7px 13px;
        color: #9a9a9a;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .main {
        display: grid;
        grid-template-columns: 1.17fr 0.83fr;
        gap: 52px;
        align-items: center;
        flex: 1;
        min-height: 0;
        padding: 12px 0 8px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0 0 18px;
        color: #ffd60a;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 28px;
        height: 2px;
        background: #ffd60a;
      }
      h1 {
        margin: 0;
        font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
        font-size: 104px;
        font-weight: 800;
        line-height: 0.82;
        letter-spacing: -0.06em;
      }
      h1 em {
        color: #ffd60a;
        font-style: normal;
      }
      .sub {
        max-width: 35ch;
        margin: 21px 0 0;
        color: #9a9a9a;
        font-size: 19px;
        line-height: 1.5;
      }
      .sub b {
        color: #f2f2f2;
        font-weight: 600;
      }
      .portrait {
        position: relative;
        justify-self: end;
        width: 338px;
      }
      .portrait img {
        display: block;
        width: 338px;
        height: 402px;
        border: 1px solid #303030;
        border-radius: 26px;
        object-fit: cover;
        object-position: center 20%;
        filter: contrast(1.04) saturate(1.05);
      }
      .portrait::before {
        content: "";
        position: absolute;
        inset: -17px;
        border: 1px solid rgba(255, 214, 10, 0.3);
        border-radius: 38px;
        rotate: -3deg;
      }
      .portrait::after {
        content: "";
        position: absolute;
        right: -18px;
        top: 40px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ffd60a;
        box-shadow: 0 0 0 6px rgba(255, 214, 10, 0.12);
      }
      .badge {
        position: absolute;
        left: -45px;
        bottom: 24px;
        padding: 12px 15px;
        border: 1px solid rgba(255, 214, 10, 0.45);
        border-radius: 14px;
        background: #ffd60a;
        color: #111;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.25;
        box-shadow: 0 18px 36px -18px rgba(0, 0, 0, 0.9);
        rotate: -2deg;
      }
      .badge span {
        display: block;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.62;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding-top: 18px;
        border-top: 1px solid #232323;
      }
      .chips {
        display: flex;
        gap: 7px;
      }
      .chips span {
        border: 1px solid #272727;
        border-radius: 99px;
        padding: 6px 12px;
        color: #bdbdbd;
        font-size: 11px;
        font-weight: 500;
      }
      .projects {
        color: #777;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-align: right;
      }
      .projects b {
        color: #bdbdbd;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="top">
        <div class="brand">lelisa<i>.</i></div>
        <div class="place">Addis Ababa · Ethiopia</div>
      </div>

      <div class="main">
        <div>
          <p class="eyebrow">Full Stack Engineer</p>
          <h1>Lelisa<br /><em>Hailu.</em></h1>
          <p class="sub">
            I design and build <b>whole products</b> — from the first sketch to the production
            server, with MERN, Next.js and Go.
          </p>
        </div>

        <div class="portrait">
          <img src="/src/assets/portrait.jpg" alt="" />
          <div class="badge">
            <span>GDG AASTU</span>
            1st place · Tech Fest 2026
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="chips">
          <span>React</span>
          <span>Next.js</span>
          <span>Go</span>
          <span>Node.js</span>
          <span>MongoDB</span>
        </div>
        <div class="projects"><b>Cheretanet</b> · Reunite · bikatTech · GreatTeam EMS</div>
      </div>
    </div>
  </body>
</html>
